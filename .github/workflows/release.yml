name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SourceLink + deterministic builds need full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Tag form: v0.1.0 -> 0.1.0
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Restore
        run: dotnet restore Datra.sln

      - name: Build
        run: dotnet build Datra.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack Datra/Datra.csproj                       -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack Datra.Generators/Datra.Generators.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack Datra.Analyzers/Datra.Analyzers.csproj   -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack Datra.Editor/Datra.Editor.csproj         -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack Datra.WebEditor/Datra.WebEditor.csproj   -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack Datra.WebEditor.Server/Datra.WebEditor.Server.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
          ls -la artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
